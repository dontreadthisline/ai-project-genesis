<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FrozenLake：MDP 的最小实例</title>
<style>
  @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500;
    src: url(../fonts/caveat-500.woff2) format('woff2'); }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #2c3a8c; }
  .fig { display: block; margin: 0 auto; }
  .caption { text-align: center; padding: 4px 24px 10px; color: #5a6078; }
</style>
<script src="../js/sketch.js"></script>
<script src="_lib.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
                     svg: { fontCache: 'global' } };
</script>
<script defer src="../../site_libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
<svg id="fig" class="fig" width="720" height="320" viewBox="0 0 720 320"></svg>
<div class="caption">$\mathcal S = 16$ 个状态（含洞与目标的终止态），动作 4 个；slippery 下预期方向只以 $1/3$ 概率成立——转移核是环境的属性。</div>
<script>

const F = Fig(document.getElementById('fig'));
const lab = [['S','F','F','F'],['F','H','F','H'],['F','F','F','H'],['H','F','F','G']];
const n = 4, x0 = 170, y0 = 30, cw = 84, ch = 62;
for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
  const t = lab[i][j];
  const fill = t === 'H' ? 'rgba(0,0,0,0.32)' : t === 'G' ? 'rgba(26,127,55,0.25)' : t === 'S' ? 'rgba(58,74,168,0.18)' : 'rgba(58,74,168,0.05)';
  F.box({ x: x0 + j * cw, y: y0 + i * ch, w: cw - 6, h: ch - 6, label: t, fill, width: 1.2, size: 18 });
}
F.text(90, y0 + n * ch / 2, 'S 起点 / H 洞（终止）\nG 目标（终止）', { size: 15, color: F.P.dim });

</script>
</body>
</html>
