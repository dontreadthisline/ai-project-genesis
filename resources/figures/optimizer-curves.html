<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>三个优化器的收敛形态</title>
<style>
  @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500;
    src: url(../fonts/caveat-500.woff2) format('woff2'); }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #2c3a8c; }
  .fig { display: block; margin: 0 auto; }
  .caption { text-align: center; padding: 4px 24px 10px; color: #5a6078; }
</style>
<script src="../js/sketch.js"></script>
<script src="_lib.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
                     svg: { fontCache: 'global' } };
</script>
<script defer src="../../site_libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
<svg id="fig" class="fig" width="720" height="330" viewBox="0 0 720 330"></svg>
<div class="caption">Adam 族早期下降最快（自适应步长）；调好学习率的 Momentum 终精度相当——SGD 需更小 $\eta$ 与更长耐心。</div>
<script>

const F = Fig(document.getElementById('fig'));
F.axis({ x0: 0, x1: 50, y0: 0, y1: 2.4, labels: ['epoch', 'loss'] });
F.curve(t => 2.3 / (1 + 0.28 * t) + 0.12, { t0: 0, t1: 50, color: F.P.dim, label: 'SGD', labelAt: 32 });
F.curve(t => 2.3 / (1 + 0.65 * t) + 0.05, { t0: 0, t1: 50, color: F.P.ink, width: 2.3, label: 'Momentum', labelAt: 24 });
F.curve(t => 2.3 / (1 + 1.5 * t) + 0.03, { t0: 0, t1: 50, color: F.P.amber, width: 2.3, label: 'Adam', labelAt: 9 });
F.text(2, 0.35, '初始 ≈ ln 10 ≈ 2.30（随机预测）', { size: 15, color: F.P.dim });

</script>
</body>
</html>
