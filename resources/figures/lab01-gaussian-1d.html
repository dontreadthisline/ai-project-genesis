<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图 1：一维高斯 — 参数的几何意义</title>
<style>
  @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500;
    src: url(../fonts/caveat-500.woff2) format('woff2'); }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #2c3a8c; }
  .fig { display: block; margin: 0 auto; }
  .figwrap { position: relative; width: 720px; margin: 0 auto; }
  .mtx { font-family: -apple-system, 'PingFang SC', sans-serif; }
  .caption { text-align: center; padding: 6px 24px 12px; color: #5a6078; }
</style>
<script src="../js/sketch.js"></script>
<script src="_lib.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
                     svg: { fontCache: 'global' } };
</script>
<script defer src="../../site_libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
<div class="figwrap">
<svg id="fig" class="fig" width="720" height="330" viewBox="0 0 720 330"></svg>
</div>
<div class="caption">
  峰高与 $\sigma$ 成反比：$p(\mu) = 1/(\sqrt{2\pi}\,\sigma)$ —— 越宽越矮，总面积恒为 1。
  极端情形 $\sigma = 0.01$ 时峰值 $\approx 39.9$：密度可以远大于 1，概率仍然只有 1。
</div>
<script>
const s = Sketch(document.getElementById('fig'));
const F = Fig(document.getElementById('fig'));
const P = s.PALETTE;
const X0 = 90, X1 = 660, Y0 = 270;      // 坐标系
const xr = t => X0 + t * (X1 - X0);     // t ∈ [-3, 3] → 像素
const yr = v => Y0 - v * 230;           // 密度值 → 像素

// 坐标轴（手绘 + 箭头）
s.path(`M ${X0 - 30} ${Y0} L ${X1 + 14} ${Y0}`, { arrow: true });
s.path(`M ${X0} ${Y0 + 16} L ${X0} 22`, { arrow: true });
F.mtex(X0 - 26, Y0 + 20, 'x', { size: 14 });
F.mtex(X0 - 14, 30, 'p(x)', { size: 14 });

// 三条曲线: μ=0, σ ∈ {0.5, 1, 2}
function gauss(x, mu, sig) {
  return Math.exp(-((x - mu) ** 2) / (2 * sig * sig)) / (sig * Math.sqrt(2 * Math.PI));
}
const curves = [
  { sig: 0.5, w: 2.2, note: { x: 0, y: 0.80 }, tag: 'σ = 0.5' },
  { sig: 1.0, w: 2.0, note: { x: 0, y: 0.40 }, tag: 'σ = 1' },
  { sig: 2.0, w: 1.7, note: { x: 0, y: 0.20 }, tag: 'σ = 2' },
];
for (const c of curves) {
  let d = '';
  for (let i = 0; i <= 72; i++) {
    const t = -3 + 6 * i / 72;
    d += (i ? 'L' : 'M') + ` ${xr(t).toFixed(1)} ${yr(gauss(t, 0, c.sig)).toFixed(1)} `;
  }
  s.path(d, { width: c.w, rough: true });
  // 峰顶小节点 + 手写标签
  const px = xr(c.note.x), py = yr(c.note.y);
  s.dot(px, py, P.deep, 3.5);
  F.mtex(px + 14, py - 12, '\\sigma = ' + c.tag.split('= ')[1] + '\\;\\text{峰}' + c.note.y.toFixed(2), { size: 15, anchor: 'start' });
}
// μ 平移的虚影: σ=1, μ=2
let d2 = '';
for (let i = 0; i <= 60; i++) {
  const t = -1 + 6 * i / 60;
  d2 += (i ? 'L' : 'M') + ` ${xr(t).toFixed(1)} ${yr(gauss(t, 2, 1)).toFixed(1)} `;
}
s.path(d2, { width: 1.4, opacity: 0.45, rough: true });
F.mtex(xr(2) + 8, yr(0.40) - 8, '\\mu = 2\\;\\text{（平移）}', { size: 15, color: '#9aa1b9', anchor: 'start' });
</script>
</body>
</html>
