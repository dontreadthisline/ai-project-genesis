<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GPT 的组件栈</title>
<style>
  @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500;
    src: url(../fonts/caveat-500.woff2) format('woff2'); }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #2c3a8c; }
  .fig { display: block; margin: 0 auto; }
  .caption { text-align: center; padding: 4px 24px 10px; color: #5a6078; }
</style>
<script src="../js/sketch.js"></script>
<script src="_lib.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
                     svg: { fontCache: 'global' } };
</script>
<script defer src="../../site_libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
<svg id="fig" class="fig" width="720" height="320" viewBox="0 0 720 320"></svg>
<div class="caption">Embedding + 位置 → $L$ 个 pre-norm Block（因果 MHA + FFN）→ 最终 LN → 权重共享 LM Head——$12Ld^2$ 参数预算的分层账。</div>
<script>

const F = Fig(document.getElementById('fig'));
const stack = ['token ids', 'Embedding + 位置', 'Block × L（MHA + FFN, pre-norm）', '最终 LayerNorm', 'LM Head（与 Embedding 共享）'];
for (let i = 0; i < stack.length; i++) {
  F.box({ x: 150, y: 250 - i * 56, w: 380, h: 44, label: stack[i], fill: 'rgba(58,74,168,0.06)', size: 15 });
  if (i < stack.length - 1) F.arrow(340, 250 - i * 56, 340, 250 - i * 56 - 12, { width: 1.4 });
}
F.text(600, 130, 'logits (B,T,V)', { size: 15, color: F.P.deep, anchor: 'start' });

</script>
</body>
</html>
