<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Clipped 目标的分段语义</title>
<style>
  @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500;
    src: url(../fonts/caveat-500.woff2) format('woff2'); }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #2c3a8c; }
  .fig { display: block; margin: 0 auto; }
  .caption { text-align: center; padding: 4px 24px 10px; color: #5a6078; }
</style>
<script src="../js/sketch.js"></script>
<script src="_lib.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
                     svg: { fontCache: 'global' } };
</script>
<script defer src="../../site_libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
<svg id="fig" class="fig" width="720" height="330" viewBox="0 0 720 330"></svg>
<div class="caption">$J = \min(\rho A, \mathrm{clip}(\rho, 1 \pm \epsilon) A)$：$A > 0$ 时上限 $1+\epsilon$（好动作别提过头）、$A < 0$ 时下限 $1-\epsilon$——越界即梯度归零。</div>
<script>

const F = Fig(document.getElementById('fig'));
F.axis({ x0: 0.4, x1: 1.6, y0: -1.3, y1: 1.3, labels: ['ρ', 'J'] });
F.curve(t => Math.min(t, 1.2) * 0.9, { t0: 0.4, t1: 1.6, color: F.P.ink, width: 2.3, label: 'A > 0', labelAt: 0.52 });
F.curve(t => Math.max(t, 0.8) * -0.9, { t0: 0.4, t1: 1.6, color: F.P.green, width: 2.3, label: 'A < 0', labelAt: 0.52 });
F.curve(t => 0, { t0: 0.4, t1: 1.6, color: 'rgba(0,0,0,0.25)', width: 0.8, rough: false });
F.vbar(0.8, 1.28, { w: 0.006, fill: 'rgba(0,0,0,0.3)', color: 'rgba(0,0,0,0)', width: 0 });
F.vbar(1.2, 1.28, { w: 0.006, fill: 'rgba(0,0,0,0.3)', color: 'rgba(0,0,0,0)', width: 0 });
F.text(0.66, -1.15, '1−ε', { size: 15, color: F.P.dim, anchor: 'middle' });
F.text(1.34, -1.15, '1+ε', { size: 15, color: F.P.dim, anchor: 'middle' });
F.text(1.42, 0.7, 'ρ > 1+ε：\nA>0 梯度归零', { size: 14, color: F.P.dim, anchor: 'start' });

</script>
</body>
</html>
