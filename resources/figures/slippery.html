<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>slippery：动作 ≠ 结果</title>
<style>
  @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500;
    src: url(../fonts/caveat-500.woff2) format('woff2'); }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #2c3a8c; }
  .fig { display: block; margin: 0 auto; }
  .figwrap { position: relative; width: 720px; margin: 0 auto; }
  .mtx { font-family: -apple-system, "PingFang SC", sans-serif; }
  .caption { text-align: center; padding: 4px 24px 10px; color: #5a6078; }
</style>
<script src="../js/sketch.js"></script>
<script src="_lib.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
                     svg: { fontCache: 'global' } };
</script>
<script defer src="../../site_libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
<div class="figwrap">
<svg id="fig" class="fig" width="720" height="300" viewBox="0 0 720 300"></svg>
</div>
<div class="caption">预期「下」时三个实际转移各 $1/3$（含撞墙折叠回原地）——策略优化的对象是这个转移核，不是意图。</div>
<script>

const F = Fig(document.getElementById('fig'));
const cx = 220, cy = 170;
F.box({ x: cx - 50, y: cy - 46, w: 100, h: 92, label: 's', fill: 'rgba(58,74,168,0.1)' });
F.arrow(cx, cy + 52, cx, cy + 118, { label: '意图: 下', width: 2.4, labelDy: 18 });
F.arrow(cx + 60, cy + 30, cx + 60, cy + 96, { label: '下 1/3', width: 1.6, color: F.P.dim, labelDy: 16 });
F.arrow(cx + 130, cy - 10, cx + 130, cy - 74, { label: '左 1/3', width: 1.6, color: F.P.dim, labelDy: -10 });
F.arrow(cx + 200, cy - 10, cx + 200, cy - 74, { label: '右 1/3', width: 1.6, color: F.P.dim, labelDy: -10 });
F.mtex(cx + 230, cy + 60, 'P(s\'|s,a)：环境说了算', { size: 16, color: F.P.deep, anchor: 'start' });

</script>
</body>
</html>
