<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>训练闭环的七步</title>
<style>
  @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500;
    src: url(../fonts/caveat-500.woff2) format('woff2'); }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #2c3a8c; }
  .fig { display: block; margin: 0 auto; }
  .figwrap { position: relative; width: 720px; margin: 0 auto; }
  .mtx { font-family: -apple-system, "PingFang SC", sans-serif; }
  .caption { text-align: center; padding: 4px 24px 10px; color: #5a6078; }
</style>
<script src="../js/sketch.js"></script>
<script src="_lib.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
                     svg: { fontCache: 'global' } };
</script>
<script defer src="../../site_libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
<div class="figwrap">
<svg id="fig" class="fig" width="720" height="300" viewBox="0 0 720 300"></svg>
</div>
<div class="caption">Prompt 采样 → Agent Rollout → 轨迹收集 → 奖励计算 → 组归一化优势 → token 级策略更新 → 评估——GRPO 迁到工具环境的全部增量在「轨迹是多步的」。</div>
<script>

const F = Fig(document.getElementById('fig'));
const steps = ['Prompt', 'Rollout', '轨迹', 'Reward', 'Â 组内', 'Update', 'Eval'];
for (let i = 0; i < steps.length; i++) {
  F.box({ x: 40 + i * 92, y: 100, w: 78, h: 40, label: steps[i], size: 13, fill: 'rgba(58,74,168,0.07)' });
  if (i < 6) F.arrow(118 + i * 92, 120, 130 + i * 92, 120, { width: 1.6 });
}
F.path('M 40 120 C 10 120, 10 190, 120 190 L 600 190 C 670 190, 670 120, 640 145', { arrow: true, color: F.P.amber, width: 1.6, opacity: 0.6 });
F.mtex(360, 218, 'on-policy \text{：数据用完即弃（多步下} off-policy \text{偏差被复合放大）}', { size: 14, color: F.P.dim, anchor: 'middle' });

</script>
</body>
</html>
