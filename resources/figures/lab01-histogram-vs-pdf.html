<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图 4：直方图密度估计 — 样本量与 bin 宽</title>
<style>
  @font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500;
    src: url(../fonts/caveat-500.woff2) format('woff2'); }
  body { margin: 0; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; color: #2c3a8c; }
  .fig { display: block; margin: 0 auto; }
  .figwrap { position: relative; width: 720px; margin: 0 auto; }
  .mtx { font-family: -apple-system, 'PingFang SC', sans-serif; }
  .caption { text-align: center; padding: 6px 24px 12px; color: #5a6078; }
</style>
<script src="../js/sketch.js"></script>
<script src="_lib.js"></script>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
                     svg: { fontCache: 'global' } };
</script>
<script defer src="../../site_libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
<div class="figwrap">
<svg id="fig" class="fig" width="720" height="330" viewBox="0 0 720 330"></svg>
</div>
<div class="caption">
  $\hat p = \text{频数}/(nh)$（即 <code>density=True</code>）。左：$n=100$ 每格仅数个样本，随机波动大；
  右：$n = 10^5$ 直方图贴合 PDF。bin 宽两难：大 $h$ 抹平结构（偏差），小 $h$ 波动剧烈（方差）。
</div>
<script>
const s = Sketch(document.getElementById('fig'));
const F = Fig(document.getElementById('fig'));
const P = s.PALETTE;

let seed = 11;
const rnd = () => (seed = (seed * 48271) % 2147483647) / 2147483647;
const gauss = () => {
  const u = Math.max(rnd(), 1e-9), v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};
const pdf = x => Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI);

// 两个 panel: n=100（14 bins）与 n=1e5（28 bins）
for (const [cx, n, nb, tag] of [[170, 100, 12, 'n = 100'], [540, 50000, 28, 'n = 10⁵']]) {
  const X0 = cx - 130, X1 = cx + 130, Y0 = 250, H = 190;
  const xr = t => X0 + (t + 3.2) / 6.4 * (X1 - X0);
  const yr = v => Y0 - v * H / 0.5;
  s.path(`M ${X0 - 8} ${Y0} L ${X1 + 12} ${Y0}`, { arrow: true, opacity: 0.6 });
  // 直方图（淡靛填充 + 手绘轮廓）
  const counts = new Array(nb).fill(0);
  const h = 6.4 / nb;
  for (let i = 0; i < n; i++) {
    const t = gauss();
    const k = Math.floor((t + 3.2) / h);
    if (k >= 0 && k < nb) counts[k]++;
  }
  for (let k = 0; k < nb; k++) {
    const xL = xr(-3.2 + k * h), xR = xr(-3.2 + (k + 1) * h);
    const y = yr(counts[k] / (n * h));
    s.path(`M ${xL} ${Y0} L ${xL} ${y} L ${xR} ${y} L ${xR} ${Y0}`,
           { fill: 'rgba(58,74,168,0.16)', width: 1.3, rough: true });
  }
  // 真实 PDF 曲线
  let d = '';
  for (let i = 0; i <= 70; i++) {
    const t = -3.2 + 6.4 * i / 70;
    d += (i ? 'L' : 'M') + ` ${xr(t).toFixed(1)} ${yr(pdf(t)).toFixed(1)} `;
  }
  s.path(d, { width: 2.2, color: P.amber, rough: false });
  F.mtex(cx, Y0 + 34, 'n = ' + tag.replace('n = ', '') + '\\;\\text{（}' + nb + '\\text{bins）}', { size: 15 });
}
F.mtex(360, 312, '\\text{琥珀色} = p(x)\\;\\;\\text{淡靛} = \\hat p', { size: 14, color: '#9aa1b9' });
</script>
</body>
</html>
