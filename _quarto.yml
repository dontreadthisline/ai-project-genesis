        - docs/stage1-probability/lab03-monte-carlo.md
        - docs/stage1-probability/lab04-entropy-kl.md
        - docs/stage1-probability/lab05-mle.md

format:
  html:
    theme: cosmo
    lang: zh
    toc: true
    toc-depth: 3
