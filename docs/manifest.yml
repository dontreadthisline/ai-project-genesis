# 书籍结构清单 —— 单一事实源（工具无关）
#
# 约定：
#   - 内容一律存放于 docs/**/*.md，front matter 携带 title 与元数据；正文不使用任何渲染器专有语法。
#   - 本文件描述成书顺序与分部。渲染层（Quarto / VitePress / mdBook ...）从本文件生成各自的目录配置，
#     生成物（如 _quarto.yml、_book/）不入库。
#   - 新增章节：在对应 part 的 chapters 中按顺序追加路径即可，所有渲染器同步生效。

